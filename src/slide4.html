<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>TerraKubePromoter — Slide 4</title>

<body>

  <div class="slide">

    <div class="diamond diamond-bottom-right"></div>

    <div class="handle">@MalikHamdane</div>

    <h1 class="heading">Architecture Diagram</h1>

    <div class="body">

      <p class="intro">The GitOps loop, in 4 stages.</p>

      <svg viewBox="0 0 880 760" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;">

        <!-- Stage 1: Developer -->
        <rect x="290" y="20" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#122040" stroke-width="2"/>
        <text x="440" y="58" text-anchor="middle" font-family="Calibri, sans-serif" font-size="26" font-weight="700" fill="#122040">Developer</text>
        <text x="440" y="88" text-anchor="middle" font-family="Calibri, sans-serif" font-size="18" fill="#2C3E50">Local workstation</text>

        <!-- Arrow 1 -->
        <line x1="440" y1="110" x2="440" y2="170" stroke="#BC6C0E" stroke-width="3" marker-end="url(#arrow)"/>
        <text x="455" y="148" font-family="Calibri, sans-serif" font-size="18" font-weight="700" fill="#BC6C0E">git push</text>

        <!-- Stage 2: GitHub -->
        <rect x="240" y="180" width="400" height="120" rx="8" fill="#FFFFFF" stroke="#122040" stroke-width="2"/>
        <text x="440" y="218" text-anchor="middle" font-family="Calibri, sans-serif" font-size="26" font-weight="700" fill="#122040">GitHub</text>
        <text x="440" y="252" text-anchor="middle" font-family="Calibri, sans-serif" font-size="18" fill="#2C3E50">app-ci.yml · manifests-ci.yml</text>
        <text x="440" y="278" text-anchor="middle" font-family="Calibri, sans-serif" font-size="18" fill="#2C3E50">terraform-ci.yml · promote.yml</text>

        <!-- Arrow 2 -->
        <line x1="440" y1="300" x2="440" y2="360" stroke="#BC6C0E" stroke-width="3" marker-end="url(#arrow)"/>
        <text x="455" y="338" font-family="Calibri, sans-serif" font-size="18" font-weight="700" fill="#BC6C0E">image to ECR + commit overlay</text>

        <!-- Stage 3: ArgoCD -->
        <rect x="290" y="370" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#122040" stroke-width="2"/>
        <text x="440" y="410" text-anchor="middle" font-family="Calibri, sans-serif" font-size="26" font-weight="700" fill="#122040">ArgoCD</text>
        <text x="440" y="444" text-anchor="middle" font-family="Calibri, sans-serif" font-size="18" fill="#2C3E50">in EKS · app-of-apps</text>
        <text x="440" y="470" text-anchor="middle" font-family="Calibri, sans-serif" font-size="18" fill="#2C3E50">3 child Applications</text>

        <!-- Arrow 3 -->
        <line x1="440" y1="490" x2="440" y2="550" stroke="#BC6C0E" stroke-width="3" marker-end="url(#arrow)"/>
        <text x="455" y="528" font-family="Calibri, sans-serif" font-size="18" font-weight="700" fill="#BC6C0E">reconcile every 3 minutes</text>

        <!-- Stage 4: 3 namespaces side by side -->
        <rect x="40"  y="560" width="260" height="120" rx="8" fill="#FFFFFF" stroke="#122040" stroke-width="2"/>
        <rect x="40"  y="560" width="6"   height="120" fill="#BC6C0E"/>
        <text x="170" y="600" text-anchor="middle" font-family="Calibri, sans-serif" font-size="22" font-weight="700" fill="#122040">dev</text>
        <text x="170" y="630" text-anchor="middle" font-family="Calibri, sans-serif" font-size="16" fill="#2C3E50">1 replica</text>
        <text x="170" y="654" text-anchor="middle" font-family="Calibri, sans-serif" font-size="16" fill="#2C3E50">image: tag</text>

        <rect x="310" y="560" width="260" height="120" rx="8" fill="#FFFFFF" stroke="#122040" stroke-width="2"/>
        <rect x="310" y="560" width="6"   height="120" fill="#BC6C0E"/>
        <text x="440" y="600" text-anchor="middle" font-family="Calibri, sans-serif" font-size="22" font-weight="700" fill="#122040">staging</text>
        <text x="440" y="630" text-anchor="middle" font-family="Calibri, sans-serif" font-size="16" fill="#2C3E50">2 replicas</text>
        <text x="440" y="654" text-anchor="middle" font-family="Calibri, sans-serif" font-size="16" fill="#2C3E50">image: tag</text>

        <rect x="580" y="560" width="260" height="120" rx="8" fill="#FFFFFF" stroke="#122040" stroke-width="2"/>
        <rect x="580" y="560" width="6"   height="120" fill="#BC6C0E"/>
        <text x="710" y="600" text-anchor="middle" font-family="Calibri, sans-serif" font-size="22" font-weight="700" fill="#122040">production</text>
        <text x="710" y="630" text-anchor="middle" font-family="Calibri, sans-serif" font-size="16" fill="#2C3E50">3 replicas</text>
        <text x="710" y="654" text-anchor="middle" font-family="Calibri, sans-serif" font-size="16" font-weight="700" fill="#BC6C0E">image: digest</text>

        <!-- Arrow marker definition -->
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#BC6C0E"/>
          </marker>
        </defs>

      </svg>

      <p class="diagram-closing">A push to <code>main</code> reconciles to a running pod within 3 minutes.</p>

    </div>

    <div class="url-pill">github.com/fred1717/TerraKubePromoter</div>

  </div>
